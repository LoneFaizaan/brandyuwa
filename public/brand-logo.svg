<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 84" width="360" height="84" fill="none">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6b84a" />
      <stop offset="50%" stop-color="#cca038" />
      <stop offset="100%" stop-color="#b08324" />
    </linearGradient>
  </defs>
  <!-- Main Brand Title -->
  <g id="brand-yuva-title" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" letter-spacing="2">
    <text x="18" y="42" fill="#0b2158">BRAND</text>
    <text x="178" y="42" fill="url(#goldLinear)">Y</text>
    <text x="207" y="42" fill="#0b2158">UVA</text>
  </g>
  <!-- Tagline: Run for fashion -->
  <g id="brand-yuva-tagline">
    <text x="170" y="68" font-family="'Caveat', 'Playball', 'Brush Script MT', 'Dancing Script', 'Alex Brush', cursive, sans-serif" font-style="italic" font-weight="600" font-size="21" fill="#143160" text-anchor="middle" letter-spacing="1">
      Run for fashion
    </text>
  </g>
</svg>
